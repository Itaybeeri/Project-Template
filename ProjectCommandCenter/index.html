<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Command Center</title>
<style>
  /* ── design tokens ──────────────────────────────────────────────────────── */
  :root {
    --bg: #070b0a;
    --bg-2: #0b1210;
    --panel: #0e1614;
    --panel-2: #111d1a;
    --line: rgba(255, 255, 255, 0.08);
    --line-2: rgba(255, 255, 255, 0.13);
    --ink: #e8f2ee;
    --ink-dim: #9fb2ab;
    --ink-faint: #6b7f78;
    --accent: #34d399;
    --accent-dim: #10b981;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.7);
    /* phase / column hues */
    --c-queued: #64748b;
    --c-brainstorm: #a78bfa;
    --c-plan: #60a5fa;
    --c-implement: #fbbf24;
    --c-test: #22d3ee;
    --c-review: #34d399;
    --c-done: #4ade80;
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(52, 211, 153, 0.10), transparent 60%),
      radial-gradient(900px 500px at 0% 0%, rgba(96, 165, 250, 0.06), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
    min-height: 100vh;
  }
  code, .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 40px) 80px; }

  /* ── header ─────────────────────────────────────────────────────────────── */
  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .brand { display: flex; gap: 16px; align-items: center; }
  .mark {
    width: 46px; height: 46px; border-radius: 13px; flex: none;
    background: linear-gradient(145deg, var(--accent), var(--accent-dim));
    display: grid; place-items: center; color: #052018; font-weight: 800; font-size: 22px;
    box-shadow: 0 8px 24px -6px rgba(52, 211, 153, 0.5);
  }
  .brand h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
  .brand .sub { color: var(--ink-dim); font-size: 13px; margin-top: 2px; }
  .controls { display: flex; align-items: center; gap: 12px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-size: 13px; color: var(--ink-dim);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(52,211,153,.6); animation: pulse 2.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)} 70%{box-shadow:0 0 0 7px rgba(52,211,153,0)} 100%{box-shadow:0 0 0 0 rgba(52,211,153,0)} }
  button.refresh {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
    color: #052018; background: linear-gradient(145deg, var(--accent), var(--accent-dim)); border: none;
    transition: transform .1s ease, filter .15s ease;
  }
  button.refresh:hover { filter: brightness(1.08); }
  button.refresh:active { transform: translateY(1px); }
  button.refresh.spin svg { animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .meta-line { color: var(--ink-faint); font-size: 12px; margin-top: 6px; text-align: right; }

  /* ── overview strip ─────────────────────────────────────────────────────── */
  .overview { margin-top: 22px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .overview { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .panel .pad { padding: 18px 20px; }
  .eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 11px; color: var(--ink-faint); font-weight: 700; }
  .desc { color: var(--ink-dim); font-size: 14px; margin-top: 8px; }
  .gp { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-sm); background: rgba(52,211,153,.06); border: 1px solid rgba(52,211,153,.18); font-size: 13px; color: var(--ink); }
  .gp b { color: var(--accent); }
  pre.diagram { margin: 0; padding: 14px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm); overflow-x: auto; font-size: 12px; color: var(--ink-dim); line-height: 1.4; }

  /* ── stat tiles ─────────────────────────────────────────────────────────── */
  .tiles { margin-top: 16px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  @media (max-width: 1000px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px 16px; }
  .tile .n { font-size: 26px; font-weight: 750; letter-spacing: -0.02em; }
  .tile .l { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .1em; margin-top: 2px; }
  .tile.accent .n { color: var(--accent); }

  /* ── section heading ────────────────────────────────────────────────────── */
  .sec-head { display: flex; align-items: baseline; gap: 12px; margin: 34px 2px 14px; }
  .sec-head h2 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  .sec-head .hint { color: var(--ink-faint); font-size: 12px; }

  /* ── kanban ─────────────────────────────────────────────────────────────── */
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-height: 120px; }
  .col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .col-head .name { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .col-head .swatch { width: 9px; height: 9px; border-radius: 3px; }
  .col-head .count { font-size: 11px; color: var(--ink-faint); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .card {
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px; margin-bottom: 10px; cursor: pointer;
    transition: transform .1s ease, border-color .15s ease, background .15s ease;
    border-left: 3px solid var(--phc, var(--line-2));
  }
  .card:last-child { margin-bottom: 0; }
  .card:hover { transform: translateY(-2px); border-color: var(--phc); background: var(--panel-2); }
  .card .cnum { font-size: 11px; color: var(--ink-faint); }
  .card .cname { font-weight: 650; font-size: 14px; margin: 2px 0 8px; letter-spacing: -0.01em; }
  .card .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .empty-col { color: var(--ink-faint); font-size: 12px; text-align: center; padding: 18px 0; }

  /* ── chips / badges ─────────────────────────────────────────────────────── */
  .chip { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-dim); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .chip.on { color: var(--accent); border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.08); }
  .chip.off { color: var(--ink-faint); opacity: .6; }
  .chip.pr { color: #c4b5fd; border-color: rgba(167,139,250,.35); background: rgba(167,139,250,.08); }
  .chip.pass { color: var(--accent); border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.08); }
  .chip.warn { color: #fbbf24; border-color: rgba(251,191,36,.35); background: rgba(251,191,36,.08); }
  .chip.git { color: #7dd3fc; border-color: rgba(125,211,252,.30); background: rgba(125,211,252,.07); }

  /* ── two-column lists ───────────────────────────────────────────────────── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
  .row { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .row:last-child { border-bottom: none; }
  .row .idx { font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink-faint); flex: none; width: 34px; }
  .row .body { flex: 1; min-width: 0; }
  .row .body .t { font-size: 13.5px; font-weight: 600; }
  .row .body .d { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
  .st { font-size: 10.5px; padding: 2px 9px; border-radius: 999px; font-weight: 650; flex: none; }
  .st.proposed { color: #fbbf24; background: rgba(251,191,36,.12); }
  .st.accepted { color: var(--accent); background: rgba(52,211,153,.12); }
  .st.deferred { color: var(--ink-dim); background: rgba(255,255,255,.06); }
  .st.superseded, .st.deprecated { color: var(--ink-faint); background: rgba(255,255,255,.05); }
  .st.graduated { color: #c4b5fd; background: rgba(167,139,250,.12); }
  .st.dropped { color: var(--ink-faint); background: rgba(255,255,255,.05); text-decoration: line-through; }
  .row.click { cursor: pointer; transition: background .12s ease; }
  .row.click:hover { background: var(--panel-2); }
  .row .tag { font-size: 10px; color: var(--ink-faint); border: 1px solid var(--line-2); border-radius: 999px; padding: 0 7px; margin-left: 8px; vertical-align: middle; }

  /* ── git activity ───────────────────────────────────────────────────────── */
  .commits { max-height: 340px; overflow-y: auto; }
  .commit { display: flex; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .commit:last-child { border-bottom: none; }
  .commit .h { font-family: ui-monospace, monospace; font-size: 11px; color: var(--accent); flex: none; }
  .commit .s { font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .commit .when { font-size: 11px; color: var(--ink-faint); flex: none; }
  .contribs { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; }
  .contrib { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-dim); background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 4px; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #052018; background: linear-gradient(145deg, var(--accent), var(--accent-dim)); }

  /* ── drawer ─────────────────────────────────────────────────────────────── */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 40; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100vh; width: min(560px, 94vw); z-index: 50;
    background: var(--panel); border-left: 1px solid var(--line-2); box-shadow: -30px 0 80px -20px rgba(0,0,0,.8);
    transform: translateX(100%); transition: transform .24s cubic-bezier(.4,0,.2,1); overflow-y: auto; overflow-x: hidden;
  }
  .drawer.open { transform: translateX(0); }
  .drawer .dhead { position: sticky; top: 0; background: linear-gradient(var(--panel), rgba(14,22,20,.9)); backdrop-filter: blur(6px); padding: 20px 22px 16px; border-bottom: 1px solid var(--line); }
  .drawer .dbody { padding: 20px 22px 60px; }
  .close { position: absolute; top: 18px; right: 18px; cursor: pointer; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--ink-dim); font-size: 16px; line-height: 1; }
  .close:hover { color: var(--ink); }
  .dsub { color: var(--ink-dim); font-size: 13px; margin-top: 10px; }
  .block { margin-top: 22px; }
  .block h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); }
  .ac { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .ac:last-child { border-bottom: none; }
  .ac .acn { color: var(--ink-faint); font-family: ui-monospace, monospace; font-size: 11px; flex: none; width: 24px; }
  .prr { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; }
  .steps { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
  .step { flex: 1; min-width: 88px; text-align: center; font-size: 12.5px; font-weight: 600; padding: 12px 10px; border-radius: 11px; border: 1px solid var(--line-2); color: var(--ink-dim); background: var(--bg-2); opacity: .55; }
  .step.done { color: #052018; font-weight: 700; background: var(--accent); border-color: var(--accent); opacity: 1; }
  .step.current { color: var(--phc); border-color: var(--phc); font-weight: 700; box-shadow: inset 0 0 0 1px var(--phc); opacity: 1; }

  /* ── shell: top tab-bar nav + full-width views ──────────────────────────── */
  .shell { margin-top: 20px; display: block; }
  .sidenav { position: sticky; top: 10px; z-index: 20; display: flex; flex-direction: row; flex-wrap: wrap;
    gap: 6px; align-items: center; margin-bottom: 22px; padding: 6px;
    background: rgba(14,22,20,.85); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px; }
  .navitem { display: flex; align-items: center; gap: 9px; cursor: pointer; white-space: nowrap;
    font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-dim);
    background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 9px 16px; transition: all .12s ease; }
  .navitem:hover { color: var(--ink); background: var(--bg-2); }
  .navitem.active { color: var(--accent); background: var(--bg-2); border-color: var(--line-2); }
  .navicon { font-size: 14px; color: var(--accent); }
  .nav-foot { margin-left: auto; padding: 0 12px; font-size: 11px; color: var(--ink-faint); }
  @media (max-width: 560px) { .nav-foot { display: none; } }
  .view .sec-head:first-child { margin-top: 0; }
  .view .overview { margin-top: 0; }

  /* ── drawer: clickable phase tabs ───────────────────────────────────────── */
  .step { cursor: pointer; font-family: inherit; line-height: 1.2; transition: filter .12s ease, transform .06s ease; }
  .step:hover { filter: brightness(1.18); }
  .step:active { transform: translateY(1px); }
  .step.sel { box-shadow: 0 0 0 2px var(--phc), 0 4px 12px -4px rgba(0,0,0,.5); }
  .step.done.sel { box-shadow: 0 0 0 2px var(--accent); }
  .steps-hint { font-size: 11px; color: var(--ink-faint); margin-top: 8px; }
  .phase-panel { animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .panel-head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 4px 0 12px; }
  .panel-head-row h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); }
  .panel-meta { margin: -4px 0 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .prr-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .dim { color: var(--ink-faint); }
  .empty-panel { text-align: center; color: var(--ink-dim); padding: 48px 20px; }
  .ep-icon { font-size: 30px; color: var(--ink-faint); opacity: .5; margin-bottom: 12px; }

  /* ── rendered markdown inside the drawer ────────────────────────────────── */
  .md { font-size: 13.5px; color: var(--ink-dim); line-height: 1.6; overflow-wrap: anywhere; word-break: break-word; }
  .md .md-h { color: var(--ink); letter-spacing: -0.01em; margin: 18px 0 8px; line-height: 1.3; }
  h3.md-h { font-size: 16px; } h4.md-h { font-size: 14px; } h5.md-h, h6.md-h { font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); }
  .md .md-p { margin: 8px 0; }
  .md .md-ul, .md .md-ol { margin: 8px 0; padding-left: 20px; }
  .md li { margin: 4px 0; }
  .md code { background: var(--bg-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 12px; color: var(--accent); }
  .md .md-pre { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 12px 0; }
  .md .md-pre code { background: none; border: none; padding: 0; color: var(--ink-dim); font-size: 12px; }
  .md strong { color: var(--ink); }
  .md a { color: var(--accent); }
  .md .md-quote { border-left: 3px solid var(--line-2); margin: 12px 0; padding: 4px 0 4px 14px; color: var(--ink-faint); }
  .md .md-hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
  .md .md-tablewrap { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 10px; }
  .md .md-table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .md .md-table th, .md .md-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .md .md-table th { color: var(--ink); font-weight: 650; background: var(--bg-2); }
  .md .md-table tr:last-child td { border-bottom: none; }

  /* commit rows as links */
  a.commit.link { text-decoration: none; color: inherit; }
  a.commit.link:hover { background: var(--panel-2); }
  .commit .ext { color: var(--ink-faint); font-size: 11px; flex: none; opacity: 0; transition: opacity .12s ease; }
  a.commit.link:hover .ext { opacity: 1; }

  .footer { margin-top: 50px; text-align: center; color: var(--ink-faint); font-size: 12px; }
  .skeleton { color: var(--ink-faint); text-align: center; padding: 80px 0; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="skeleton">Loading project state…</div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script>
// ── state loading (works served, or as an inlined static snapshot) ──────────
const COLUMN_HUES = {
  'Queued': 'c-queued', 'Brainstorm': 'c-brainstorm', 'Plan': 'c-plan',
  'Implement': 'c-implement', 'Test': 'c-test', 'Review/Merge': 'c-review', 'Done': 'c-done',
};
let LIVE = false;
let TIMER = null;
let STATE = null;
let DRAWER_F = null;

const PHASE_HUE = { 'Brainstorm': 'c-brainstorm', 'Plan': 'c-plan', 'Implement': 'c-implement', 'Test': 'c-test', 'Review/Merge': 'c-review' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const hue = (col) => `var(--${COLUMN_HUES[col] || 'c-queued'})`;
const phaseHue = (ph) => `var(--${PHASE_HUE[ph] || 'c-queued'})`;
const initials = (name) => (name || '?').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();

// Minimal, dependency-free markdown → HTML (headings, lists, tables, code,
// blockquotes, hr, inline bold/code/links) — enough for our docs.
function splitCells(line) { return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim()); }
function mdInline(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdToHtml(md) {
  if (!md) return '';
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  let html = '', i = 0;
  const isBreak = (l, n) => /^(#{1,6}\s|```|\s*[-*]\s|\s*\d+\.\s|\s*>|\s*---+\s*$)/.test(l) || (l.includes('|') && /^[\s|:-]+$/.test(n || ''));
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) { let code = ''; i++; while (i < lines.length && !/^```/.test(lines[i])) { code += lines[i] + '\n'; i++; } i++; html += `<pre class="md-pre"><code>${esc(code.replace(/\n$/, ''))}</code></pre>`; continue; }
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) { const lv = Math.min(h[1].length + 2, 6); html += `<h${lv} class="md-h">${mdInline(h[2])}</h${lv}>`; i++; continue; }
    if (/^\s*---+\s*$/.test(line)) { html += '<hr class="md-hr">'; i++; continue; }
    if (line.includes('|') && /^[\s|:-]+$/.test(lines[i + 1] || '')) {
      const header = splitCells(line); i += 2; const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) { rows.push(splitCells(lines[i])); i++; }
      html += `<div class="md-tablewrap"><table class="md-table"><thead><tr>${header.map((c) => `<th>${mdInline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; continue;
    }
    if (/^\s*>\s?/.test(line)) { let q = ''; while (i < lines.length && /^\s*>\s?/.test(lines[i])) { q += lines[i].replace(/^\s*>\s?/, '') + ' '; i++; } html += `<blockquote class="md-quote">${mdInline(q.trim())}</blockquote>`; continue; }
    if (/^\s*[-*]\s+/.test(line)) { const items = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++; } html += `<ul class="md-ul">${items.map((it) => `<li>${mdInline(it)}</li>`).join('')}</ul>`; continue; }
    if (/^\s*\d+\.\s+/.test(line)) { const items = []; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*\d+\.\s+/, '')); i++; } html += `<ol class="md-ol">${items.map((it) => `<li>${mdInline(it)}</li>`).join('')}</ol>`; continue; }
    if (/^\s*$/.test(line)) { i++; continue; }
    let para = line; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !isBreak(lines[i], lines[i + 1])) { para += ' ' + lines[i]; i++; }
    html += `<p class="md-p">${mdInline(para)}</p>`;
  }
  return html;
}

async function loadState() {
  if (window.__STATE__) { LIVE = false; return window.__STATE__; }
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (r.ok) { LIVE = true; return await r.json(); }
  } catch (e) {}
  try {
    const r = await fetch('./data.json', { cache: 'no-store' });
    if (r.ok) { LIVE = false; return await r.json(); }
  } catch (e) {}
  throw new Error('Could not load project state. Run `node ProjectCommandCenter/serve.mjs` or `node ProjectCommandCenter/generate.mjs`.');
}

async function refresh(fromButton) {
  const btn = document.querySelector('button.refresh');
  if (btn && fromButton) btn.classList.add('spin');
  try {
    STATE = await loadState();
    render(STATE);
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="skeleton">⚠ ${esc(e.message)}</div>`;
  }
  if (btn) setTimeout(() => btn.classList.remove('spin'), 400);
}

// ── render ──────────────────────────────────────────────────────────────────
const NAV = [
  { id: 'pipeline', label: 'Delivery pipeline', icon: '▦' },
  { id: 'overview', label: 'Overview', icon: '◈' },
  { id: 'decisions', label: 'Decisions & CI', icon: '⧉' },
  { id: 'ideas', label: 'Ideas', icon: '✦' },
  { id: 'activity', label: 'Activity', icon: '⎇' },
];
let VIEW = 'pipeline';

function render(s) {
  const p = s.project, st = s.stats;
  const updated = new Date(s.generatedAt);
  const app = document.getElementById('app');
  app.innerHTML = `
    ${header(p, updated)}
    <div class="shell">
      <nav class="sidenav">
        ${NAV.map((n) => `<button class="navitem" data-view="${n.id}" onclick="showView('${n.id}')"><span class="navicon">${n.icon}</span>${esc(n.label)}</button>`).join('')}
        <div class="nav-foot">${LIVE ? '● live' : '○ static'} · ${st.totalFeatures} features</div>
      </nav>
      <div class="views">
        <section class="view" id="view-pipeline">
          ${tiles(st, s)}
          ${boardSection(s)}
        </section>
        <section class="view" id="view-overview" hidden>
          <div class="sec-head"><h2>Overview</h2><span class="hint">${esc(p.name)} · ${esc(shortStatus(p.status))}</span></div>
          ${overview(p)}
        </section>
        <section class="view" id="view-decisions" hidden>${decisionsSection(s)}</section>
        <section class="view" id="view-ideas" hidden>${ideasSection(s)}</section>
        <section class="view" id="view-activity" hidden>${gitSection(s)}</section>
      </div>
    </div>
    <div class="footer">Generated from <code>docs/</code> + git by <code>ProjectCommandCenter/collect.mjs</code> · ${LIVE ? 'live' : 'static snapshot'}</div>
  `;
  wireCards(s);
  const v = new URLSearchParams(location.search).get('v');
  if (v && NAV.some((n) => n.id === v)) VIEW = v;
  showView(VIEW);
  scheduleRefresh();
  // Deep link: #<num> or #<num>/<Phase> opens that feature's drawer (shareable).
  const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
  const [num, ph] = raw.split('/');
  if (num === 'idea' && ph) {
    const i = (s.ideas || []).find((x) => x.num === ph);
    if (i) { showView('ideas'); openIdeaDrawer(i); }
  } else if (num) {
    const f = s.features.find((x) => x.num === num); if (f) openDrawer(f, s, ph);
  }
}

function showView(id) {
  VIEW = id;
  document.querySelectorAll('.view').forEach((v) => { v.hidden = v.id !== `view-${id}`; });
  document.querySelectorAll('.navitem').forEach((n) => n.classList.toggle('active', n.dataset.view === id));
}

function header(p, updated) {
  return `
  <header class="top">
    <div class="brand">
      <div class="mark">◆</div>
      <div>
        <h1>${esc(p.name)}</h1>
        <div class="sub">Project Command Center · ${esc(p.currentBranch || '—')} ${p.defaultBranch && p.defaultBranch !== p.currentBranch ? `· default <code>${esc(p.defaultBranch)}</code>` : ''}</div>
      </div>
    </div>
    <div style="text-align:right">
      <div class="controls">
        <span class="status-pill"><span class="dot"></span>${esc(shortStatus(p.status))}</span>
        <button class="refresh" onclick="refresh(true)" title="Refresh now">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          Refresh
        </button>
      </div>
      <div class="meta-line" id="metaline">updated ${timeAgo(updated)}${LIVE ? ' · auto-refresh 60s' : ' · static'}</div>
    </div>
  </header>`;
}

function shortStatus(s) { return (s || '').split(/[.——]/)[0].trim() || 'unknown'; }

function overview(p) {
  return `
  <div class="overview">
    <div class="panel"><div class="pad">
      <div class="eyebrow">What this is</div>
      <div class="desc">${p.description ? esc(p.description) : '<span style="color:var(--ink-faint)">No project description yet — fill <code>CLAUDE.md → Project</code>.</span>'}</div>
      ${p.guidingPrinciple ? `<div class="gp">${mdBold(p.guidingPrinciple)}</div>` : ''}
    </div></div>
    <div class="panel"><div class="pad">
      <div class="eyebrow">Core mental model</div>
      ${p.mentalModelDiagram ? `<pre class="diagram">${esc(p.mentalModelDiagram)}</pre>` : (p.mentalModel ? `<div class="desc">${esc(p.mentalModel)}</div>` : '<div class="desc" style="color:var(--ink-faint)">Not documented yet.</div>')}
    </div></div>
  </div>`;
}

function mdBold(s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }

function tiles(st, s) {
  const items = [
    { n: st.totalFeatures, l: 'Features', accent: false },
    { n: st.active, l: 'In flight', accent: true },
    { n: st.queued, l: 'Queued', accent: false },
    { n: st.done, l: 'Done', accent: false },
    { n: st.adrs, l: 'ADRs', accent: false },
    { n: st.openIdeas || 0, l: 'Open ideas', accent: false },
    { n: st.totalAcceptanceCriteria, l: 'Accept. criteria', accent: false },
  ];
  return `<div class="tiles">${items.map((t) => `
    <div class="tile ${t.accent ? 'accent' : ''}"><div class="n">${t.n}</div><div class="l">${esc(t.l)}</div></div>`).join('')}</div>`;
}

function boardSection(s) {
  const cols = s.columns.map((col) => {
    const cards = s.features.filter((f) => f.column === col);
    return `
      <div class="col" style="--phc:${hue(col)}">
        <div class="col-head">
          <div class="name"><span class="swatch" style="background:${hue(col)}"></span>${esc(col)}</div>
          <span class="count">${cards.length}</span>
        </div>
        ${cards.length ? cards.map((f) => card(f)).join('') : '<div class="empty-col">—</div>'}
      </div>`;
  }).join('');
  return `
    <div class="sec-head"><h2>Delivery pipeline</h2><span class="hint">every feature by lifecycle phase · click a card for detail</span></div>
    <div class="board">${cols}</div>`;
}

function card(f) {
  const chips = [];
  if (f.pr) chips.push(`<span class="chip pr">PR #${esc(f.pr.number)}</span>`);
  if (f.planReviewVerdict === 'PASS') chips.push('<span class="chip pass">plan ✓</span>');
  else if (f.planReviewVerdict) chips.push(`<span class="chip warn">${esc(f.planReviewVerdict.toLowerCase())}</span>`);
  if (f.acceptanceCriteria?.length) chips.push(`<span class="chip">${f.acceptanceCriteria.length} AC</span>`);
  if (f.branchExists) chips.push('<span class="chip git">branch</span>');
  if (f.status && /reserved/i.test(f.status)) chips.push('<span class="chip off">reserved</span>');
  return `
    <div class="card" data-num="${esc(f.num)}" style="--phc:${hue(f.column)}">
      <div class="cnum mono">${esc(f.num)}</div>
      <div class="cname">${esc(f.name)}</div>
      <div class="chips">${chips.join('')}</div>
    </div>`;
}

function decisionsSection(s) {
  return `
    <div class="grid-2">
      <div>
        <div class="sec-head"><h2>Architecture decisions</h2><span class="hint">${s.adrs.length} ADR${s.adrs.length===1?'':'s'}</span></div>
        <div class="panel">${s.adrs.length ? s.adrs.map(adrRow).join('') : emptyRow('No ADRs recorded yet.')}</div>
      </div>
      <div>
        <div class="sec-head"><h2>CI-roadmap</h2><span class="hint">deferred work + triggers</span></div>
        <div class="panel">${s.ciRoadmap.length ? s.ciRoadmap.map(ciRow).join('') : emptyRow('No deferred CI items.')}</div>
      </div>
    </div>`;
}

function adrRow(a) {
  return `<div class="row">
    <div class="idx">${esc(a.num)}</div>
    <div class="body"><div class="t">${esc(a.title)}</div>${a.summary ? `<div class="d">${esc(a.summary)}</div>` : ''}</div>
    <span class="st ${statusClass(a.status)}">${esc(a.status)}</span>
  </div>`;
}

function ciRow(i) {
  return `<div class="row">
    <div class="idx">${esc(i.id)}</div>
    <div class="body"><div class="t">${esc(i.item)}</div><div class="d">Trigger: ${esc(i.trigger)}</div></div>
    <span class="st ${statusClass(i.status)}">${esc(i.status)}</span>
  </div>`;
}

function statusClass(s) {
  const v = (s || '').toLowerCase();
  if (v.includes('accept')) return 'accepted';
  if (v.includes('propos')) return 'proposed';
  if (v.includes('defer')) return 'deferred';
  if (v.includes('supersed')) return 'superseded';
  if (v.includes('deprecat')) return 'deprecated';
  return 'deferred';
}

function emptyRow(t) { return `<div class="row"><div class="body"><div class="d">${esc(t)}</div></div></div>`; }

// ── ideas & thoughts ─────────────────────────────────────────────────────────
function ideasSection(s) {
  const ideas = s.ideas || [];
  return `
    <div class="sec-head"><h2>Ideas &amp; thoughts</h2><span class="hint">notepad of things worth talking about · <code>docs/IDEAS.md</code></span></div>
    <div class="panel">${ideas.length ? ideas.map(ideaRow).join('') : emptyRow('No ideas captured yet — jot the first one in docs/IDEAS.md.')}</div>`;
}

function ideaRow(i) {
  const clickable = i.body ? ' click' : '';
  return `<div class="row${clickable}" ${i.body ? `data-idea="${esc(i.num)}"` : ''}>
    <div class="idx">${esc(i.num)}</div>
    <div class="body">
      <div class="t">${esc(i.title)}${i.tag ? `<span class="tag">${esc(i.tag)}</span>` : ''}</div>
      ${i.summary ? `<div class="d">${esc(i.summary)}</div>` : ''}
    </div>
    <span class="st ${ideaStatusClass(i.status)}">${esc(i.status)}</span>
  </div>`;
}

function ideaStatusClass(s) {
  const v = (s || '').toLowerCase();
  if (v.includes('graduat')) return 'graduated';
  if (v.includes('drop')) return 'dropped';
  if (v.includes('discuss')) return 'accepted';
  if (v.includes('park')) return 'deferred';
  return 'proposed'; // Open / anything else
}

function gitSection(s) {
  const g = s.git;
  if (!g.isRepo) return '';
  return `
    <div class="grid-2">
      <div>
        <div class="sec-head"><h2>Recent activity</h2><span class="hint">last ${g.commits.length} commits${g.dirtyCount ? ` · ${g.dirtyCount} uncommitted` : ''}</span></div>
        <div class="panel commits">${g.commits.map(commitRow).join('') || emptyRow('No commits.')}</div>
      </div>
      <div>
        <div class="sec-head"><h2>Contributors</h2><span class="hint">by commit count</span></div>
        <div class="panel"><div class="contribs">${g.contributors.map((c) => `
          <div class="contrib"><span class="avatar">${esc(initials(c.name))}</span>${esc(c.name)} · ${c.count}</div>`).join('') || emptyRow('—')}</div>
        </div>
      </div>
    </div>`;
}

function commitRow(c) {
  const base = STATE && STATE.git && STATE.git.remoteUrl;
  const inner = `<span class="h">${esc(c.hash)}</span><span class="s">${esc(c.subject)}</span><span class="when">${esc(c.rel)}</span>`;
  return base
    ? `<a class="commit link" href="${esc(base)}/commit/${esc(c.hash)}" target="_blank" rel="noopener" title="Open commit on GitHub">${inner}<span class="ext">↗</span></a>`
    : `<div class="commit">${inner}</div>`;
}

// ── drawer (feature detail) ──────────────────────────────────────────────────
function wireCards(s) {
  document.querySelectorAll('.card').forEach((el) => {
    el.addEventListener('click', () => openDrawer(s.features.find((f) => f.num === el.dataset.num), s));
  });
  document.querySelectorAll('.row[data-idea]').forEach((el) => {
    el.addEventListener('click', () => openIdeaDrawer((s.ideas || []).find((i) => i.num === el.dataset.idea)));
  });
  document.getElementById('scrim').onclick = closeDrawer;
}

function openIdeaDrawer(i) {
  if (!i) return;
  DRAWER_F = null;
  const d = document.getElementById('drawer');
  d.style.setProperty('--phc', 'var(--accent)');
  d.innerHTML = `
    <button class="close" onclick="closeDrawer()">✕</button>
    <div class="dhead">
      <div class="eyebrow">Idea ${esc(i.num)} · ${esc(i.status)}</div>
      <h1 style="margin:8px 0 0;font-size:21px;letter-spacing:-.02em">${esc(i.title)}</h1>
      <div class="dsub">${i.summary ? esc(i.summary) : 'No summary.'}</div>
      <div class="chips" style="gap:6px;margin-top:12px">
        <span class="chip">status: ${esc(i.status)}</span>
        ${i.tag ? `<span class="chip">${esc(i.tag)}</span>` : ''}
        <span class="chip off">docs/IDEAS.md</span>
      </div>
    </div>
    <div class="dbody"><div class="phase-panel">${i.body
      ? `<div class="panel-head-row"><h4>Memo</h4><span class="dim mono">docs/IDEAS.md</span></div><div class="md">${mdToHtml(i.body)}</div>`
      : emptyPanel('No memo written yet — add notes under this idea in docs/IDEAS.md.', 'docs/IDEAS.md')}</div></div>`;
  d.classList.add('open');
  document.getElementById('scrim').classList.add('open');
  history.replaceState(null, '', `#idea/${i.num}`);
}

function openDrawer(f, s, wantPhase) {
  if (!f) return;
  DRAWER_F = f;
  const d = document.getElementById('drawer');
  const steps = s.phases.map((ph, i) => {
    const done = f.column === 'Done' || (f.phaseIndex >= 0 && i < f.phaseIndex);
    const current = ph === f.phase && f.column !== 'Done' && f.column !== 'Queued';
    return `<button class="step ${done ? 'done' : ''} ${current ? 'current' : ''}" style="--phc:${phaseHue(ph)}" data-phase="${esc(ph)}" onclick="selectPhase('${esc(ph)}')">${done ? '✓ ' : ''}${esc(ph)}</button>`;
  }).join('');

  d.style.setProperty('--phc', hue(f.column));
  d.innerHTML = `
    <button class="close" onclick="closeDrawer()">✕</button>
    <div class="dhead">
      <div class="eyebrow">Feature ${esc(f.num)} · ${esc(f.column)}</div>
      <h1 style="margin:8px 0 0;font-size:21px;letter-spacing:-.02em">${esc(f.name)}</h1>
      <div class="dsub">${f.summary ? esc(f.summary) : 'No summary.'}</div>
      <div class="steps" id="stepper">${steps}</div>
      <div class="steps-hint">↑ click a phase to see what was done in it</div>
      <div class="chips" style="gap:6px;margin-top:12px">
        <span class="chip">status: ${esc(f.status)}</span>
        ${f.pr ? `<span class="chip pr">PR #${esc(f.pr.number)}</span>` : ''}
        ${f.planReviewVerdict ? `<span class="chip ${f.planReviewVerdict==='PASS'?'pass':'warn'}">plan-review: ${esc(f.planReviewVerdict)}</span>` : ''}
        <span class="chip ${f.branchExists?'git':'off'}">${esc(f.branch)}${f.branchExists?' ✓':''}</span>
        ${(f.relatedAdrs||[]).map((a) => `<span class="chip">${esc(a)}</span>`).join('')}
      </div>
    </div>
    <div class="dbody"><div id="phase-panel" class="phase-panel"></div></div>`;
  d.classList.add('open');
  document.getElementById('scrim').classList.add('open');
  const initial = (wantPhase && s.phases.includes(wantPhase)) ? wantPhase
    : (f.column !== 'Queued' && f.column !== 'Done') ? f.phase
    : (f.column === 'Done' ? 'Review/Merge' : 'Brainstorm');
  selectPhase(initial);
}

function selectPhase(ph) {
  const f = DRAWER_F; if (!f) return;
  document.querySelectorAll('#stepper .step').forEach((el) => el.classList.toggle('sel', el.dataset.phase === ph));
  document.getElementById('phase-panel').innerHTML = phaseContent(f, ph);
  const body = document.querySelector('.drawer .dbody'); if (body) body.scrollTop = 0;
  history.replaceState(null, '', `#${f.num}/${encodeURIComponent(ph)}`);
}

function phaseContent(f, ph) {
  const a = f.artifacts || {};
  if (ph === 'Brainstorm') {
    return docPanel('Brainstorm', `docs/features/${f.slug}/brainstorm.md`, a.brainstorm,
      f.architectReviewPassed ? '<span class="chip pass">architect-review ✓</span>' : '',
      'Explore the real problem and the options before committing to a design.');
  }
  if (ph === 'Plan') {
    const rounds = (f.planReviewRounds || []).map((r) => `<span class="prr-chip"><b>rd ${r.round}</b> <span class="chip ${r.verdict === 'PASS' ? 'pass' : 'warn'}">${esc(r.verdict)}</span> <span class="dim">${esc(r.date || '')}</span></span>`).join('');
    const head = rounds ? `<div class="panel-meta"><span class="dim">plan-review:</span> ${rounds}</div>` : '';
    return docPanel('Plan · spec.md', `docs/features/${f.slug}/spec.md`, a.spec, head,
      'Decide and write it down: scope, approach, acceptance criteria.');
  }
  if (ph === 'Implement') return implementPanel(f);
  if (ph === 'Test') return testPanel(f);
  if (ph === 'Review/Merge') return reviewPanel(f);
  return '';
}

function docPanel(title, path, md, headHtml, blurb) {
  if (!md) return emptyPanel(blurb, path);
  return `<div class="panel-head-row"><h4>${esc(title)}</h4><span class="dim mono">${esc(path)}</span></div>${headHtml || ''}<div class="md">${mdToHtml(md)}</div>`;
}
function emptyPanel(blurb, path) {
  return `<div class="empty-panel"><div class="ep-icon">◇</div><div>${esc(blurb)}</div>${path ? `<div class="dim mono" style="margin-top:8px">${esc(path)} — not created yet</div>` : ''}</div>`;
}
function implementPanel(f) {
  const commits = f.commits || [];
  const list = commits.length
    ? `<div class="commits" style="border:1px solid var(--line);border-radius:10px;max-height:none">${commits.map((c) => commitRow(c)).join('')}</div>`
    : `<div class="dim" style="font-size:13px">No commits found mentioning <code>${esc(f.slug)}</code> yet.</div>`;
  return `
    <div class="panel-head-row"><h4>Implement</h4><span class="dim">build on a dedicated branch</span></div>
    <div class="chips" style="gap:6px;margin-bottom:14px">
      <span class="chip ${f.branchExists ? 'git' : 'off'}">${esc(f.branch)}${f.branchExists ? ' ✓' : ' (not created)'}</span>
      ${f.pr ? `<span class="chip pr">PR #${esc(f.pr.number)}</span>` : ''}
      <span class="chip">${(f.acceptanceCriteria || []).length} acceptance criteria</span>
    </div>
    <h4>Commits mentioning this feature</h4>${list}`;
}
function testPanel(f) {
  const acs = f.acceptanceCriteria || [];
  if (!acs.length) return emptyPanel('Verify every acceptance criterion is COVERED before merge.', null);
  return `<div class="panel-head-row"><h4>Acceptance criteria (${acs.length})</h4><span class="dim">what Test must verify</span></div>
    ${acs.map((a) => `<div class="ac"><span class="acn">${a.n}</span><div>${esc(a.title)}${a.tag ? ` <span class="chip" style="font-size:9.5px">${esc(a.tag)}</span>` : ''}</div></div>`).join('')}`;
}
function reviewPanel(f) {
  const merged = f.column === 'Done';
  return `<div class="panel-head-row"><h4>Review / Merge</h4><span class="dim">gate + integrate</span></div>
    <div class="chips" style="gap:6px">
      ${f.pr ? `<span class="chip pr">PR #${esc(f.pr.number)}</span>` : '<span class="chip off">no PR yet</span>'}
      <span class="chip ${merged ? 'pass' : 'warn'}">${merged ? 'merged · Done' : 'not merged'}</span>
      ${f.planReviewVerdict === 'PASS' ? '<span class="chip pass">plan-review ✓</span>' : ''}
    </div>
    <div class="dim" style="font-size:13px;margin-top:14px;line-height:1.6">Merge only when every acceptance criterion is COVERED, the branch is in sync with the default branch, and the gate is green.</div>`;
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

// ── auto-refresh + relative time ─────────────────────────────────────────────
function scheduleRefresh() {
  if (TIMER) clearInterval(TIMER);
  if (!LIVE) return;
  TIMER = setInterval(() => refresh(false), 60000);
}
function timeAgo(d) {
  const s = Math.round((Date.now() - d.getTime()) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.round(s/60)}m ago`;
  return d.toLocaleString();
}
setInterval(() => {
  const el = document.getElementById('metaline');
  if (el && STATE) el.textContent = `updated ${timeAgo(new Date(STATE.generatedAt))}${LIVE ? ' · auto-refresh 60s' : ' · static'}`;
}, 15000);

refresh(false);
</script>
</body>
</html>
